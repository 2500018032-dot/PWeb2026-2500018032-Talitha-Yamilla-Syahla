<!DOCTYPE html>
<html>
<head>
    <title>Konversi Nilai Angka ke Huruf</title>
</head>
<body>

    <h2>Program Konversi Nilai</h2>

    <script>
        // Input nilai
        let nilai = parseInt(prompt("Masukkan nilai (0 - 100):"));

        let huruf;

        // Percabangan IF
        if (nilai >= 0 && nilai <= 20) {
            huruf = "E";
        }
        else if (nilai >= 21 && nilai <= 39) {
            huruf = "D";
        }
        else if (nilai >= 40 && nilai <= 64) {
            huruf = "C";
        }
        else if (nilai >= 65 && nilai <= 79) {
            huruf = "B";
        }
        else if (nilai >= 80 && nilai <= 100) {
            huruf = "A";
        }
        else {
            huruf = "Nilai Tidak Valid";
        }

        // Menampilkan hasil
        document.write("<h3>Nilai Angka : " + nilai + "</h3>");
        document.write("<h3>Nilai Huruf : " + huruf + "</h3>");
    </script>

    <hr>

    <h3>Tabel Konversi Nilai</h3>

    <table border="1" cellpadding="10">
        <tr>
            <th>Rentang Nilai</th>
            <th>Nilai Huruf</th>
        </tr>

        <tr>
            <td>0 - 20</td>
            <td>E</td>
        </tr>

        <tr>
            <td>21 - 39</td>
            <td>D</td>
        </tr>

        <tr>
            <td>40 - 64</td>
            <td>C</td>
        </tr>

        <tr>
            <td>65 - 79</td>
            <td>B</td>
        </tr>

        <tr>
            <td>80 - 100</td>
            <td>A</td>
        </tr>
    </table>

    <hr>

    <h3>Contoh Output</h3>

    <p>
        Jika memasukkan nilai <b>20</b>, maka hasil yang muncul adalah:
    </p>

    <p>
        Nilai Huruf : <b>E</b>
    </p>

</body>
</html>
